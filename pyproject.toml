[project]
name = "ladir"
version = "0.1.0"
description = "LaDiR: latent diffusion reasoning for code generation"
requires-python = ">=3.10"
dependencies = [
    "torch==2.6.*",
    "transformers>=5.5,<5.6",
    "accelerate>=1.10",
    "safetensors",
    "huggingface_hub>=1.0",
    "omegaconf",
    "datasets",
    "evalplus==0.3.1",
]

[tool.setuptools.packages.find]
include = ["ladir*", "sft*", "vae*", "eval*"]
